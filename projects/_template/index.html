<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Project | Ernesto Ramirez</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<!-- ============================================================
     NEW PROJECT TEMPLATE
     1. Copy this whole folder and rename it (e.g. "micro-mouse").
     2. Change data-project below to that same name.
     3. Add a matching entry in assets/js/projects.js
        (title, summary, tags, etc. go THERE, not here).
     4. Put your images in this folder and write the sections below.
     The menu, title, intro, tags, GitHub button, next/previous
     links and footer are added automatically.
     ============================================================ -->
<body data-root="../../" data-project="CHANGE-ME">
<main class="wrap">

  <!-- Key numbers under the title. Copy or delete stat blocks as needed. -->
  <div class="stats">
    <div class="stat"><div class="v">00 dB</div><div class="k">What this number means</div></div>
    <div class="stat"><div class="v">00 MHz</div><div class="k">Another key spec or result</div></div>
  </div>

  <article class="prose">

    <h2>Goal</h2>
    <p>What problem were you solving, and why?</p>

    <h2>Design</h2>
    <p>How it works and the key decisions you made.</p>

    <!-- One full-width image (click opens full size): -->
    <figure>
      <a href="photo.jpg" target="_blank" rel="noopener"><img src="photo.jpg" alt="Describe the image" data-ph="Photo"></a>
      <figcaption>Caption for the image.</figcaption>
    </figure>

    <!-- Two images side by side: -->
    <div class="figs">
      <figure><a href="left.jpg" target="_blank" rel="noopener"><img src="left.jpg" alt="" data-ph="Left image"></a><figcaption>Left caption.</figcaption></figure>
      <figure><a href="right.jpg" target="_blank" rel="noopener"><img src="right.jpg" alt="" data-ph="Right image"></a><figcaption>Right caption.</figcaption></figure>
    </div>

    <!-- A short looping video (H.264 .mp4, muted):
    <figure class="video">
      <video src="clip.mp4" autoplay muted loop playsinline controls></video>
      <figcaption>Caption.</figcaption>
    </figure>
    -->

    <h2>Results</h2>
    <ul>
      <li>Measured result or outcome.</li>
    </ul>

    <h2>What's next</h2>
    <p>Where the project goes from here.</p>

  </article>
</main>
<script src="../../assets/js/projects.js"></script>
<script src="../../assets/js/site.js"></script>
</body>
</html>
